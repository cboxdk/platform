apiVersion: v1
kind: Namespace
metadata:
  name: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/database: 01J0000000000000000000DB02
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: cache
    app.kubernetes.io/managed-by: cbox-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: cache-credentials
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/database: 01J0000000000000000000DB02
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: cache
    app.kubernetes.io/managed-by: cbox-platform
type: Opaque
stringData:
  password: fixed-password-for-the-golden
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/database: 01J0000000000000000000DB02
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: cache
    app.kubernetes.io/managed-by: cbox-platform
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels:
      platform.cbox.dk/database: 01J0000000000000000000DB02
  template:
    metadata:
      labels:
        platform.cbox.dk/managed: 'true'
        platform.cbox.dk/organization: 01J0000000000000000000ORG1
        platform.cbox.dk/database: 01J0000000000000000000DB02
        app.kubernetes.io/name: cache
        app.kubernetes.io/instance: cache
        app.kubernetes.io/managed-by: cbox-platform
      annotations:
        zeropod.ctrox.dev/container-names: cache
        zeropod.ctrox.dev/ports-map: cache=3306
        zeropod.ctrox.dev/scaledown-duration: 60s
    spec:
      runtimeClassName: zeropod
      containers:
        -
          name: cache
          image: 'ghcr.io/cboxdk/percona:8.0'
          ports:
            - containerPort: 3306
              name: percona
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          env:
            - name: CBOX_WAKE_MODE
              value: warm
            -
              name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cache-credentials
                  key: password
  volumeClaimTemplates:
    -
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/database: 01J0000000000000000000DB02
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: cache
    app.kubernetes.io/managed-by: cbox-platform
spec:
  selector:
    platform.cbox.dk/database: 01J0000000000000000000DB02
  ports:
    - name: percona
      port: 3306
      targetPort: 3306

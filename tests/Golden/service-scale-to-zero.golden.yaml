apiVersion: v1
kind: Namespace
metadata:
  name: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/service: 01J0000000000000000000SVC1
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: 01J0000000000000000000SVC1
    app.kubernetes.io/managed-by: cbox-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/service: 01J0000000000000000000SVC1
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: 01J0000000000000000000SVC1
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: cbox-platform
    app.kubernetes.io/version: 1.4.2
spec:
  replicas: 2
  selector:
    matchLabels:
      platform.cbox.dk/service: 01J0000000000000000000SVC1
  template:
    metadata:
      labels:
        platform.cbox.dk/managed: 'true'
        platform.cbox.dk/organization: 01J0000000000000000000ORG1
        platform.cbox.dk/service: 01J0000000000000000000SVC1
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: 01J0000000000000000000SVC1
        app.kubernetes.io/component: web
        app.kubernetes.io/managed-by: cbox-platform
        app.kubernetes.io/version: 1.4.2
        platform.cbox.dk/process: web
      annotations:
        zeropod.ctrox.dev/container-names: web
        zeropod.ctrox.dev/ports-map: web=3000
        zeropod.ctrox.dev/scaledown-duration: 120s
    spec:
      runtimeClassName: zeropod
      containers:
        -
          name: web
          image: 'ghcr.io/acme/web:1.4.2'
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: GODEBUG
              value: multipathtcp=0
            - name: PHP_OPCACHE_JIT
              value: 'off'
      topologySpreadConstraints:
        -
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
              platform.cbox.dk/process: web
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/service: 01J0000000000000000000SVC1
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: 01J0000000000000000000SVC1
    app.kubernetes.io/managed-by: cbox-platform
spec:
  selector:
    platform.cbox.dk/service: 01J0000000000000000000SVC1
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: cx-production-svc9k2
  labels:
    platform.cbox.dk/managed: 'true'
    platform.cbox.dk/organization: 01J0000000000000000000ORG1
    platform.cbox.dk/service: 01J0000000000000000000SVC1
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: 01J0000000000000000000SVC1
    app.kubernetes.io/managed-by: cbox-platform
spec:
  hostnames:
    - app.acme.example
  parentRefs:
    - name: cbox-gateway
      namespace: cx-production-svc9k2
  rules:
    -
      backendRefs:
        - name: web
          port: 80

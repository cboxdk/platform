apiVersion: v1
kind: Namespace
metadata:
  name: cx-production-db9k2
  labels:
    cortex.io/managed: 'true'
    cortex.io/organization: 01J0000000000000000000ORG1
    cortex.io/database: 01J0000000000000000000DB01
    app.kubernetes.io/name: primary
    app.kubernetes.io/managed-by: cortex-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: primary-backup-credentials
  namespace: cx-production-db9k2
  labels:
    cortex.io/managed: 'true'
    cortex.io/organization: 01J0000000000000000000ORG1
    cortex.io/database: 01J0000000000000000000DB01
    cortex.io/backup: operator
    app.kubernetes.io/name: primary
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: cortex-sync
type: Opaque
stringData:
  access-key-id: FIXTURE-ACCESS-KEY
  secret-access-key: FIXTURE-SECRET-KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: primary
  namespace: cx-production-db9k2
  labels:
    cortex.io/managed: 'true'
    cortex.io/organization: 01J0000000000000000000ORG1
    cortex.io/database: 01J0000000000000000000DB01
    app.kubernetes.io/name: primary
    app.kubernetes.io/managed-by: cortex-sync
  annotations:
    cnpg.io/hibernation: 'off'
spec:
  instances: 3
  imageName: 'ghcr.io/cloudnative-pg/postgresql:16'
  storage:
    size: 20Gi
  postgresql:
    parameters:
      max_connections: '200'
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  backup:
    barmanObjectStore:
      destinationPath: 's3://cortex-backups/cortex/01J0000000000000000000ORG1/primary'
      endpointURL: 'https://fsn1.your-objectstorage.com'
      s3Credentials:
        accessKeyId:
          name: primary-backup-credentials
          key: access-key-id
        secretAccessKey:
          name: primary-backup-credentials
          key: secret-access-key
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: primary
  namespace: cx-production-db9k2
  labels:
    cortex.io/managed: 'true'
    cortex.io/organization: 01J0000000000000000000ORG1
    cortex.io/database: 01J0000000000000000000DB01
    app.kubernetes.io/name: primary
    app.kubernetes.io/managed-by: cortex-sync
spec:
  schedule: '0 2 * * *'
  backupOwnerReference: self
  cluster:
    name: primary

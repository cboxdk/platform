    platform.cbox.dk/service: cbox-id
    app.kubernetes.io/name: cbox-id
    app.kubernetes.io/instance: cbox-id
    app.kubernetes.io/managed-by: cbox-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      platform.cbox.dk/service: cbox-id
      platform.cbox.dk/process: web

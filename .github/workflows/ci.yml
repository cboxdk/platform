name: CI

on:
  push:
    branches: [main]
    # Release tags too, so the SBOM gate runs where a supply-chain record matters.
    tags: ["v*"]
  pull_request:

jobs:
  qa:
    # The org's own runner, not ubuntu-latest: GitHub-hosted jobs are refused for
    # this account, and a workflow that cannot start looks exactly like one that
    # merely failed. Every step below has therefore actually executed.
    runs-on: [self-hosted, linux, x64, buildx]
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      # A library, so composer.lock is deliberately not committed: CI resolves
      # fresh and finds an upstream break the day it ships rather than the day
      # somebody happens to update.
      - run: composer update --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test
      # Level max, no baseline, nothing ignored.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pest
        run: vendor/bin/pest --compact

      # Coverage in a container rather than through setup-php, for the same
      # reason cortex-v2 builds its frontend that way: this is the org's buildx
      # runner, and docker is the one thing it is guaranteed to have. A gate
      # that cannot start looks exactly like one that merely failed.
      #
      # The floor is below the current number on purpose. A gate pinned to the
      # exact figure fails on an unrelated one-line change, and a gate people
      # expect to fail is one they stop reading.
      - name: Coverage
        if: matrix.php == '8.4'
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.4-cli sh -c '
            pecl install pcov >/dev/null 2>&1 && docker-php-ext-enable pcov >/dev/null 2>&1
            php -d pcov.enabled=1 vendor/bin/pest --coverage --min=90 --compact
          '

      # The supply-chain half of the gate. What this package compiles ends up in
      # customers' own clusters, so a copyleft runtime dependency is their
      # licensing problem too, and a vulnerable one reaches their infrastructure.
      - name: License compliance
        run: composer license-check
      - name: Security audit
        run: composer audit --no-dev

      - name: SBOM
        if: matrix.php == '8.4'
        run: composer sbom

      # An SBOM documents a RELEASE, so the gate lives on tags. Compare the
      # dependency SET rather than resolved versions: this is a library, so
      # composer.lock is deliberately not committed — CI resolves fresh, which is
      # what catches an upstream break the day it ships — and it therefore picks
      # up any patch published since `composer sbom` was last run locally. An
      # exact-match gate would be unwinnable, and a gate that cannot be satisfied
      # is one people learn to ignore. The set still catches what provenance
      # cares about: a dependency added or removed without regenerating.
      #
      # The EXACT versions a release resolved are recorded by the artifact
      # uploaded below, which is the authoritative record precisely because the
      # committed file cannot be one.
      - name: SBOM dependency set is current (release tags)
        if: matrix.php == '8.4' && startsWith(github.ref, 'refs/tags/')
        run: |
          git show HEAD:sbom.json > /tmp/sbom-committed.json
          jq -r '[.components[].name] | sort | .[]' /tmp/sbom-committed.json > /tmp/set-committed.txt
          jq -r '[.components[].name] | sort | .[]' sbom.json > /tmp/set-resolved.txt
          if ! diff -u /tmp/set-committed.txt /tmp/set-resolved.txt; then
            echo "::error::sbom.json lists a different dependency SET than this release resolves. Run 'composer sbom' and commit before tagging."
            exit 1
          fi

      # The provenance record for a release: what this build actually resolved,
      # not what somebody's laptop resolved when they last ran the generator.
      # Without a committed lockfile this is the only reproducible answer to
      # "what was in v0.2.0", so it is kept for as long as GitHub will keep it.
      - name: Upload the resolved SBOM (release tags)
        if: matrix.php == '8.4' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.json
          retention-days: 90
          if-no-files-found: error
